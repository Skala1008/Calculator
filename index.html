<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY CAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1 id="title" class="title">My Calculator</h1>
        <input type="text" class="display" placeholder="enter value" >
        <div class="mode">
            <button>Basic</button>
            <button>Scientific</button>
            <button>Converter</button>
            
            <!-- <button>Programe</button> -->
        </div>
        <div class="buttons">
            <button id="delete">del</button>
            <button id="clear">AC</button>
            <button>%</button>
            <button>M+</button>
            <button id="bracket">(</button>
            <button id="bracketClose">)</button>
            <button id="sqrt">  </button>
            <button id="power">  </button>
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button id="divide">/</button>
          
          <button class="number">4</button>
          <button class="number">5</button>
          <button class="number">6</button>
          <button id="multiply">*</button>
          
          <button class="number">1</button>
          <button class="number">2</button>
          <button class="number">3</button>
          <button id="subtract">-</button>
          
          <button class="number">0</button>
          <button class="operator" id="decimal">.</button>
          <button class="operator" id="equals">=</button>
          <button id="add">+</button>
         
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
